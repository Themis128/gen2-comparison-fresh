# Deployment Configuration for Baltzakis Themis Portfolio

project:
  name: "baltzakis-themis-portfolio-amplify-gen2-todo"
  framework: "Next.js 15"
  runtime: "Node.js 18+"
  package_manager: "pnpm"

environments:
  development:
    name: "sandbox"
    command: "npx ampx sandbox"
    frontend_url: "http://localhost:50000"
    backend: "local"
    
  production:
    name: "main"
    command: "npx ampx deploy"
    branch: "main"
    auto_deploy: true

amplify:
  version: "Gen2"
  region: "us-east-1"
  
  backend_services:
    - GraphQL API
    - Cognito User Pools
    - DynamoDB
    - Real-time subscriptions
    - Social OAuth providers

  build_settings:
    commands:
      preBuild:
        - "npm ci"
      build:
        - "npm run build"
    artifacts:
      baseDirectory: ".next"
      files:
        - "**/*"
    cache:
      paths:
        - "node_modules/**/*"
        - ".next/cache/**/*"

environment_variables:
  required:
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
  
  optional:
    - AWS_REGION
    - NODE_ENV

oauth_setup:
  google:
    console_url: "https://console.cloud.google.com/"
    redirect_uris:
      - "http://localhost:3000/auth/signin"
      - "https://yourdomain.com/auth/signin"
  
  github:
    settings_url: "https://github.com/settings/developers"
    callback_urls:
      - "http://localhost:3000/auth/signin"
      - "https://yourdomain.com/auth/signin"

deployment_steps:
  development:
    - "pnpm install"
    - "cp .env.example .env.local"
    - "npx ampx configure"
    - "npx ampx sandbox"
    - "pnpm dev"
  
  production:
    - "Configure OAuth providers"
    - "Set environment variables in Amplify console"
    - "npx ampx deploy"
    - "Verify deployment"

testing:
  e2e_tests: "npx playwright test"
  auth_tests: "npx playwright test tests/e2e/auth.spec.ts"
  
monitoring:
  logs: "Amplify Console"
  metrics: "CloudWatch"
  errors: "Amplify Console"