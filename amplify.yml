version: 1
compute:
  type: BUILD_GENERAL1_SMALL
backend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - cp package.build.json package.json
        - pnpm install
    build:
      commands:
        - echo "Using static files"
  artifacts:
    baseDirectory: static
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
      - .pnpm-store/**/*
      - .pnpm-store/**/*
      - .next/cache/**/*
